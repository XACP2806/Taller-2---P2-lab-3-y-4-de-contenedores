services:
  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - datos-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  cursos:
    build: ./cursos
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/academia?authSource=admin"
    depends_on:
      mongodb:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./cursos
          target: /app
          ignore:
            - node_modules/
            - package.json
            - package-lock.json
        - action: rebuild
          path: ./cursos/package.json

  estudiantes:
    build: ./estudiantes
    ports:
      - "5000:5000"

  reportes:
    build: ./reportes
    ports:
      - "4000:4000"
    environment:
      CURSOS_URL: "http://cursos:3000"
      ESTUDIANTES_URL: "http://estudiantes:5000"
    depends_on:
      - cursos
      - estudiantes

volumes:
  datos-mongo:
    external: true
    name: datos-mongo